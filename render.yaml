services:
  - type: web
    name: riskai
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn risk_analyzer.wsgi:application --workers 1 --timeout 120 --log-level debug
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: MYSQLDATABASE
        sync: false
      - key: MYSQLHOST
        sync: false
      - key: MYSQLPASSWORD
        sync: false
      - key: MYSQLPORT
        sync: false
      - key: MYSQLUSER
        sync: false
